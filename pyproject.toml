
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cryptopals-python"
version = "0.1.0"
description = "Python solutions to the Cryptopals Crypto Challenges"
requires-python = ">=3.11"
dependencies = [
    "pycryptodome>=3.20"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"

